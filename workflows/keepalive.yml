name: Supabase Keepalive

# Supabase 무료 플랜의 7일 무접속 자동정지를 막기 위해
# 3일마다 가벼운 요청을 보내 프로젝트를 깨어있게 유지합니다.

on:
  schedule:
    - cron: "0 0 */3 * *"   # 3일마다 00:00 UTC
  workflow_dispatch:          # 수동 실행 버튼도 제공

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to keep project alive..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/topics?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $HTTP"
          # 200(정상) 또는 401/403(인증거절이지만 서버는 응답=깨어있음) 이면 성공으로 간주
          if [ "$HTTP" = "200" ] || [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
            echo "Supabase is awake. OK."
          else
            echo "Unexpected status: $HTTP"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
